trigger: none
pr: none

schedules:
- cron: '0 6 * * *'
  displayName: Daily Node 24 security check (06:00 UTC)
  branches:
    include:
    - master
  always: true

parameters:
- name: pool
  type: object
  default:
    vmImage: ubuntu-latest

pool: ${{ parameters.pool }}

jobs:
- job: CheckNode24
  displayName: Check bundled Node 24 for security releases and CVEs
  timeoutInMinutes: 15
  steps:
  - checkout: self
    fetchDepth: 1

  - task: UseNode@1
    displayName: Use Node 24 for monitoring
    inputs:
      version: '24.x'

  - script: npm ci --ignore-scripts --no-audit --no-fund
    workingDirectory: .azure-pipelines/scripts
    displayName: Install monitoring dependencies

  - script: npm test
    workingDirectory: .azure-pipelines/scripts
    displayName: Test monitoring logic

  - script: node check-node24.js "$(Build.ArtifactStagingDirectory)/node24-security"
    workingDirectory: .azure-pipelines/scripts
    displayName: Check agent Node 24 pin

  - task: PublishPipelineArtifact@1
    displayName: Publish Node 24 security reports
    condition: and(succeededOrFailed(), eq(variables['Node24ReportReady'], 'true'))
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/node24-security
      artifact: node24-security
