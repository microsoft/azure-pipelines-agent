# This workflow ensures that all PRs are correctly labeled

name: LabelChecker
on: [pull_request]

jobs:
  label:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - run: |
        cd .github/labelChecker
        npm install
        node index.js
