# This workflow ensures that all PRs are correctly labeled

name: LabelChecker
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  label:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - run: |
        cd .github/labelChecker
        npm install
        node index.js
